# CTF tracing overlay for qemu_x86. Build with:
#   west build -b qemu_x86 app -- -DEXTRA_CONF_FILE=tracing.conf \
#       -DEXTRA_DTC_OVERLAY_FILE=tracing_qemu_x86.overlay
# and run with QEMU_EXTRA_FLAGS="-serial file:channel0_0" so uart1
# writes the raw CTF stream to a file.
CONFIG_SHELL=n
CONFIG_KERNEL_SHELL=n
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_BACKEND_UART=y
CONFIG_TRACING_BUFFER_SIZE=4096
CONFIG_DEBUG_THREAD_INFO=y
